version: "3.8"

services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - avishag_data:/data
    env_file:
      - .env
    expose:
      - "8000"
    restart: unless-stopped

volumes:
  avishag_data:
